[package]
name = "venus-ess-winter-soc-service"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
fs2 = "=0.4.3"
getrandom = "=0.3.4"
libc = "=0.2.189"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
signal-hook = "=0.3.18"
time = { version = "=0.3.47", features = ["formatting", "local-offset"] }
zbus = { version = "=5.18.0", features = ["blocking-api"] }

[dev-dependencies]
proptest = "=1.8.0"
tempfile = "=3.23.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
