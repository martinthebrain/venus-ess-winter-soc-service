name: Release Assets

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  upload-release-bundle:
    name: Upload Venus OS ARMv7 bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Build release bundle
        run: |
          chmod +x install.sh uninstall.sh deploy/venus/install.sh service/run service-shadow/run
          tar -czf venus-ess-winter-soc-service-armv7.tar.gz \
            LICENSE README.md CONTRACTS.md config.env.example install.sh uninstall.sh \
            bin deploy service service-shadow

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            venus-ess-winter-soc-service-armv7.tar.gz \
            install.sh \
            bin/venus-ess-winter-soc-service \
            --clobber
