name: Release Assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  upload-release-bundle:
    name: Upload Venus OS ARMv7 bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Build release bundle
        run: |
          chmod +x install.sh uninstall.sh deploy/venus/install.sh service/run service-shadow/run
          scripts/build-release-assets.sh "${GITHUB_REF_NAME}" release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/install.sh \
            release-assets/venus-ess-winter-soc-service-armv7.tar.gz \
            release-assets/venus-ess-winter-soc-service \
            release-assets/SHA256SUMS \
            --clobber
