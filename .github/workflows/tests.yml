name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust contracts and reproducible ARMv7 build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0

      - name: Run formatting, tests, and lints
        # Boundary tests use a private daemon, not the runner's system bus.
        # Ubuntu provides dbus-daemon through the dbus package.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dbus
          scripts/check.sh

      - name: Verify immutable release assets
        run: |
          scripts/build-release-assets.sh v0.0.0-ci /tmp/winter-soc-release-assets
          sh -n /tmp/winter-soc-release-assets/install.sh
          tar -tzf /tmp/winter-soc-release-assets/venus-ess-winter-soc-service-armv7.tar.gz \
            | grep -Fx deploy/venus/install.sh

      - name: Rebuild the deployed ARMv7 binary
        run: |
          cp bin/venus-ess-winter-soc-service /tmp/venus-ess-winter-soc-service.before
          scripts/build-armv7.sh

      - name: Verify reproducible deployment binary
        run: cmp /tmp/venus-ess-winter-soc-service.before bin/venus-ess-winter-soc-service
